apiVersion: v1
kind: Service
metadata:
  name: loadbalancer-demo
  labels:
    purpose: loadbalancer-demo
spec:
  type: LoadBalancer
  selector:
    project: roboshop
    env: dev
    purpose: loadbalancer-demo
  ports:
    protocol: TCP
    port: 80
    targetPort: 80


---

apiVersion: v1
kind: Pod
metadata:
  name: pod-lb
  labels:
    project: roboshop
    env: dev
    # purpose: loadbalancer-demo
spec:
  containers:
    - name: nginx
      image: nginx