apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-demo
  labels: 
    purpose: Deployment-demo-labels
spec:
  replicas: 2
  selector: 
    matchLabels:
      project: roboshop
      env: dev
      purpose: Deployment-demo
  template:
    metadata:
      name: pod-deployment
      labels: 
        project: roboshop
        env: dev
        purpose: Deployment-demo
    spec:
      containers:
      - name: nginx
        image: nginx


---

apiVersion: v1 
kind: Service 
metadata:
  name: service-deployment
  labels: 
    purpose: Service-demo-deployment
spec:
  selector:
    project: roboshop
    env: dev
    purpose: Deployment-demo


    