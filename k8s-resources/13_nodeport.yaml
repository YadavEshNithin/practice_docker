apiVersion: v1
kind: Service
metadata:
  name: nodeport-service
  labels:
    purpose: nodeport-service-demo
spec:
  type: NodePort
  selector:
    project: roboshop
    env: dev
    purpose: nodeport-service-demo
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80

---

apiVersion: v1
kind: Pod
metadata:
  name: pod-nodeport
  labels:
   project: roboshop
   env: dev
   purpose: nodeport-service-demo
spec:
  containers:
    - name: nginx
      image: nginx
      