apiVersion: v1 
kind: Pod 
metadata:
  name: node_affinity
  purpose: node_affinity_hardrule
spec:
  affinity: 
    nodeAffinity: 
      requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
          - key: hardware
            operator: In
            values:
            - gpu
  containers:
    - name: nginx 
      image: nginx 